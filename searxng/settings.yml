use_default_settings: true

server:
  secret_key: "abstrator-local-only-change-me"
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    User-Agent: "abstrator/0.1 (+https://github.com/local/abstrator)"

search:
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"

outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
  pool_connections: 50

engines:
  # --- Web geral ---
  - name: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    shortcut: ddg
    disabled: false

  # --- Técnico / código ---
  - name: github
    shortcut: gh
    disabled: false
  - name: stackoverflow
    shortcut: stck
    disabled: false

  # --- Desabilitados ---
  - name: google
    shortcut: g
    disabled: true
  - name: brave
    shortcut: brave
    disabled: true
  - name: arxiv
    shortcut: arx
    disabled: true
  - name: google scholar
    shortcut: gos
    disabled: true
  - name: semantic scholar
    shortcut: ssc
    disabled: true
  - name: crossref
    shortcut: cr
    disabled: true