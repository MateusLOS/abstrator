use_default_settings: true

server:
  secret_key: "abstrator-local-only-change-me"
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    User-Agent: "abstrator/0.1 (+https://github.com/local/abstrator)"

search:
  formats:
    - html
    - json
  safe_search: 1
  autocomplete: ""
  default_lang: "auto"

outgoing:
  request_timeout: 20.0
  max_request_timeout: 30.0
  pool_connections: 100

engines:
  - name: arxiv
    shortcut: arx
    disabled: false
  - name: google scholar
    shortcut: gos
    disabled: false
  - name: semantic scholar
    shortcut: ssc
    disabled: false
  - name: crossref
    shortcut: cr
    disabled: false
  - name: github
    shortcut: gh
    disabled: false
  - name: stackoverflow
    shortcut: stck
    disabled: false